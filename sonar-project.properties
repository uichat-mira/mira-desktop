sonar.organization=uichat-mira-1
sonar.projectKey=uichat-mira_mira-desktop
sonar.projectName=UIChat Mira Desktop

# Phase 1: analyze the maintained Desktop runtime surfaces.
sonar.sources=desktop/src,server/src,electron,packages/core,packages/remote-relay,scripts,mira-clipper-ext/extension,mira-clipper-ext/native-host
sonar.tests=desktop/src,server/src,packages/core,packages/remote-relay,scripts,mira-clipper-ext/extension/tests,mira-clipper-ext/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.cjs,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/*.spec.cjs,**/*.spec.mjs
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.cjs,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx,**/*.spec.js,**/*.spec.cjs,**/*.spec.mjs,**/node_modules/**,**/dist/**,**/release/**,**/.artifacts/**,**/coverage/**,**/test-report/**,mira-clipper-ext/output/**,mira-clipper-ext/test-results/**
# Locale resources intentionally share the same key tree across languages; that
# structural repetition is translation contract, not copy-pasted implementation.
sonar.cpd.exclusions=desktop/src/**/i18n/*.ts

# Phase 1 imports coverage only from the Desktop suite, which is CI-stable.
# Server and the remaining runtime surfaces still receive static analysis; their
# coverage stays excluded until their full test harness is portable and stable.
sonar.javascript.lcov.reportPaths=desktop/coverage/lcov.info
sonar.coverage.exclusions=server/**,electron/**,packages/**,scripts/**,mira-clipper-ext/**,**/*.config.*,**/*.d.ts

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
