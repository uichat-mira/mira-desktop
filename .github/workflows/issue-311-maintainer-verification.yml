name: "#311 Maintainer Reproduction"

on:
  push:
    branches:
      - feat/311-review-verification
    paths:
      - .github/workflows/issue-311-maintainer-verification.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:${{ github.workspace }}/.test-artifact/issue-311-reproduction.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Prepare isolated artifacts
        run: mkdir -p .test-artifact
      - name: Install server workspace
        run: pnpm install --frozen-lockfile --filter @ui-chat-mira/server...
      - name: Run actual #311 test matrix (not included in pnpm check)
        run: pnpm --filter @ui-chat-mira/server test -- src/agent/progressive-acceptance/cases.test.ts --maxWorkers=1 --fileParallelism=false
      - name: Execute report-generating deterministic acceptance runner
        run: pnpm --filter @ui-chat-mira/server bench:progressive:acceptance
      - name: Upload reproducible acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-311-maintainer-reproduction
          path: .test-artifact/progressive-resolution-acceptance/
          if-no-files-found: warn
