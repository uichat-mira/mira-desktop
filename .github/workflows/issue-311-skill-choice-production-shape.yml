name: "#311 Skill Activation vs Delegation Contract Probe"

on:
  push:
    branches:
      - feat/311-skill-choice-diagnosis
    paths:
      - .github/workflows/issue-311-skill-choice-production-shape.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      DATABASE_URL: file:${{ github.workspace }}/.test-artifact/issue-311-skill-production-shape.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: mkdir -p .test-artifact
      - run: pnpm install --frozen-lockfile --filter @ui-chat-mira/server...
      - name: Replay six real-model decisions with production-like delegation and plan contract
        env:
          AI_PROVIDER_OPENCODE_GO_KEY: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
          MIRA_DIAG_PRODUCTION_PLANNER_SHAPE: "1"
        shell: bash
        run: |
          if [ -z "$AI_PROVIDER_OPENCODE_GO_KEY" ]; then echo "Missing credential"; exit 1; fi
          successes=0
          failures=0
          for trial in 1 2 3 4 5 6; do
            echo "PRODUCTION_SHAPE_TRIAL=$trial"
            if pnpm --filter @ui-chat-mira/server exec tsx scripts/smoke-skill-progressive-live.ts; then
              successes=$((successes + 1))
            else
              failures=$((failures + 1))
            fi
          done
          echo "PRODUCTION_SHAPE_RESULT activate_skill=$successes other_or_failed=$failures total=6"
          echo "Diagnostic only; no runtime rule or production dependency was changed."
