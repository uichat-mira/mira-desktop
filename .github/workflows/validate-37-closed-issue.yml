name: Validate Worker Closed Issue Gate

on:
  push:
    branches:
      - feat/37-external-worker-caller
    paths:
      - .github/workflows/validate-37-closed-issue.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  closed-issue-must-fail:
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@b5cff98a7fdf0c78cbc1323a1d7662849c9bf285
    with:
      issue_number: 268
      base_branch: dev
      verification_command: "true"
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
