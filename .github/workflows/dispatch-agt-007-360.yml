name: "Dispatch AGT-007 Free Worker #360"

# One bounded, GitHub-native dispatch; no default-branch mutation.
on:
  push:
    branches:
      - chore/dispatch-agt-007-360
    paths:
      - .github/workflows/dispatch-agt-007-360.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@01ae59aec896a1262a399ae0cde7d67db5dd5ac0
    with:
      issue_number: 360
      base_branch: dev
      free_mode: true
      provider: opencode
      model: mimo-v2.6-flash-free
      verification_command: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm check
