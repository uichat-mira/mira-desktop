name: "Dispatch AGT-007 Paid Worker #360"

# One bounded GitHub-native dispatch; code delivery remains on dev via Draft PR.
on:
  push:
    branches:
      - chore/dispatch-agt-007-360
    paths:
      - .github/workflows/dispatch-agt-007-360.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    # Same pinned paid Worker route as the repository's approved prod caller.
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@621bc797562ee2ba92e77e215deb68833113231e
    with:
      issue_number: 360
      base_branch: dev
      provider: opencode-go
      model: deepseek-v4.1-flash
      verification_command: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm check
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
