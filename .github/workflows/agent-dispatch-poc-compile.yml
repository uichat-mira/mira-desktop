name: Agent Dispatch POC Compile

on:
  push:
    branches:
      - feat/agent-dispatch-poc
    paths:
      - .github/workflows/mira-agent-worker.md
      - .github/workflows/agent-dispatch-poc-compile.yml

permissions:
  actions: write
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC branch
        uses: actions/checkout@v4
        with:
          ref: feat/agent-dispatch-poc
          fetch-depth: 1
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Install pinned gh-aw compiler
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/gh-aw"
          curl -fsSL "https://github.com/github/gh-aw/releases/download/v0.91.1/linux-amd64" -o "$binary"
          echo "747c553f13c73e4d71f9aff6d5fd59926b3580cc1afd8d72632fed6604c7acf9  $binary" | sha256sum -c -
          chmod +x "$binary"
          "$binary" --version

      - name: Compile agentic workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw" compile .github/workflows/mira-agent-worker.md --strict

      - name: Verify generated lock
        shell: bash
        run: |
          set -euo pipefail
          test -s ".github/workflows/mira-agent-worker.lock.yml"

      - name: Launch read-only agent probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '1\n' | "$RUNNER_TEMP/gh-aw" run mira-agent-worker \
            --push \
            --ref feat/agent-dispatch-poc \
            --approve \
            --json | tee "$RUNNER_TEMP/mira-agent-worker-run.json"

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: mira-agent-worker-lock
          path: .github/workflows/mira-agent-worker.lock.yml
          if-no-files-found: error
          retention-days: 1
