name: Agent Dispatch POC Compile

on:
  push:
    branches:
      - feat/agent-dispatch-poc
    paths:
      - .github/workflows/mira-agent-worker.md
      - .github/workflows/shared/mira-opencode-go.md
      - .github/workflows/agent-dispatch-poc-compile.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout POC branch
        uses: actions/checkout@v4
        with:
          ref: feat/agent-dispatch-poc
          fetch-depth: 1
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Probe OpenCode Go provider
        shell: bash
        env:
          AI_PROVIDER_OPENCODE_GO_KEY: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/opencode-go-probe.json"
          umask 077
          status="$(curl --silent --show-error --max-time 20 \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $AI_PROVIDER_OPENCODE_GO_KEY" \
            --header "Content-Type: application/json" \
            --header "User-Agent: mira-agent-dispatch-poc/0.1" \
            --header "x-opencode-session: mira-agent-dispatch-provider-probe" \
            --header "x-opencode-request: provider-probe-1" \
            --data '{"model":"deepseek-v4.1-flash","messages":[{"role":"user","content":"Reply with exactly pong."}],"max_tokens":16}' \
            https://opencode.ai/zen/go/v1/chat/completions)"
          echo "OpenCode Go probe HTTP status: $status"
          if [[ "$status" != 2* ]]; then
            jq -r '.error | {type, code, message}' "$response" 2>/dev/null || true
            echo "OpenCode Go provider probe failed." >&2
            exit 1
          fi
          jq -e '.choices[0].message.content | type == "string" and length > 0' "$response" >/dev/null
          rm -f "$response"

      - name: Install pinned gh-aw prerelease
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/gh-aw"
          curl -fsSL "https://github.com/github/gh-aw/releases/download/v0.91.1/linux-amd64" -o "$binary"
          echo "747c553f13c73e4d71f9aff6d5fd59926b3580cc1afd8d72632fed6604c7acf9  $binary" | sha256sum -c -
          chmod +x "$binary"
          "$binary" --version

      - name: Compile agentic workflow
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw" compile .github/workflows/mira-agent-worker.md --strict
          git diff --check
          test -s ".github/workflows/mira-agent-worker.lock.yml"

      - name: Verify read-only compiled policy
        shell: bash
        run: |
          set -euo pipefail
          lock=".github/workflows/mira-agent-worker.lock.yml"
          grep -q 'AI_PROVIDER_OPENCODE_GO_KEY' "$lock"
          grep -q 'opencode-go/deepseek-v4.1-flash' "$lock"
          if grep -q 'OPENAI_API_KEY' "$lock"; then
            echo "Unexpected OPENAI_API_KEY dependency remains in compiled worker." >&2
            exit 1
          fi
          if grep -qE 'issues:[[:space:]]+write' "$lock"; then
            echo "Read-only smoke unexpectedly requests issues: write." >&2
            exit 1
          fi

      - name: Stage compiled lock for maintainer promotion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .gh-aw-poc
          cp .github/workflows/mira-agent-worker.lock.yml .gh-aw-poc/mira-agent-worker.lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gh-aw-poc/mira-agent-worker.lock.yml
          if git diff --cached --quiet; then
            echo "Staged lock is already current."
          else
            git commit -m "poc: stage compiled agent worker lock"
            git push origin HEAD:feat/agent-dispatch-poc
          fi

      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: mira-agent-worker-lock
          path: .github/workflows/mira-agent-worker.lock.yml
          if-no-files-found: error
          retention-days: 1
