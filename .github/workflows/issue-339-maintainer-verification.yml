name: "#339 Independent Planner Contract Verification Recheck"

on:
  push:
    branches: [feat/339-maintainer-verification]
    paths: [.github/workflows/issue-339-maintainer-verification.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:${{ github.workspace }}/.test-artifact/issue339.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: mkdir -p .test-artifact
      - name: Install server dependencies
        run: pnpm install --frozen-lockfile --filter @ui-chat-mira/server...
      - name: Run NEW #339 regressions (not included in Worker verification)
        run: pnpm --filter @ui-chat-mira/server test -- src/agent/__tests__/planner-skill-vs-delegation.test.ts --maxWorkers=1 --fileParallelism=false
      - name: Recheck live five-case Planner probe after import repair
        if: always()
        env:
          AI_PROVIDER_OPENCODE_GO_KEY: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
        run: |
          if [ -z "$AI_PROVIDER_OPENCODE_GO_KEY" ]; then echo "::warning::No OpenCode Go secret; no live evidence."; exit 0; fi
          pnpm --filter @ui-chat-mira/server exec tsx scripts/smoke-planner-skill-vs-delegation.ts 1
      - name: Archive probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue339-real-model-first-action-probe
          path: .test-artifact/planner-skill-vs-delegation-real-smoke.json
          if-no-files-found: ignore
