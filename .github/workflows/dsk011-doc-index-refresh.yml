name: DSK-011 One-Time Docs Index Rebuild

on:
  push:
    branches:
      - feat/dsk-011-tauri-retirement-recovery

permissions:
  contents: write

jobs:
  docs-index:
    if: github.repository == 'uichat-mira/mira-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate index from current documentation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/dsk-011-tauri-retirement-recovery"
          node packages/docs-site/scripts/build-docs-index.mjs
          git diff --check
      - name: Commit generated index
        shell: bash
        run: |
          set -euo pipefail
          git add -- packages/docs-site/src/generated/docs-index.json
          if git diff --cached --quiet; then
            echo 'Documentation index already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(dsk-011): regenerate index after review fixes'
          git push origin HEAD:refs/heads/feat/dsk-011-tauri-retirement-recovery
