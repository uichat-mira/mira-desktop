name: "#311 Skill vs Delegation Diagnostic"

on:
  push:
    branches:
      - feat/311-skill-choice-diagnosis
    paths:
      - .github/workflows/issue-311-skill-choice-diagnosis.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      DATABASE_URL: file:${{ github.workspace }}/.test-artifact/issue-311-skill-choice.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: mkdir -p .test-artifact
      - run: pnpm install --frozen-lockfile --filter @ui-chat-mira/server...
      - name: Repeat identical real-model decision 6 times (diagnostic; no repair)
        env:
          AI_PROVIDER_OPENCODE_GO_KEY: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
        shell: bash
        run: |
          if [ -z "$AI_PROVIDER_OPENCODE_GO_KEY" ]; then echo "Missing credential"; exit 1; fi
          successes=0
          failures=0
          for trial in 1 2 3 4 5 6; do
            echo "DIAGNOSTIC_TRIAL_START=$trial"
            if pnpm --filter @ui-chat-mira/server exec tsx scripts/smoke-skill-progressive-live.ts; then
              successes=$((successes + 1))
            else
              failures=$((failures + 1))
            fi
          done
          echo "DIAGNOSTIC_RESULT success=$successes failure=$failures total=6"
          echo "Diagnostic-only: no repair, no assertion of acceptance."
