# One-shot, branch-scoped start for DSK-015 only.
# Deliberately isolated from dev/test/prod so no packaging or branch promotion occurs.
name: Start DSK-015 bounded Worker (one-shot)
on:
  push:
    branches:
      - chore/dispatch-dsk-015
    paths:
      - .github/workflows/dispatch-dsk-015.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  worker:
    if: ${{ github.repository == 'uichat-mira/mira-desktop' && github.ref == 'refs/heads/chore/dispatch-dsk-015' }}
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@d26f48116d042efd03287bfa93d78cf417fbb7ca
    with:
      issue_number: 481
      base_branch: dev
      timeout_minutes: 60
      validation_profile: desktop-cloud-fast
      validation_max_tier: L3
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
      haomai_reporter_hmac_secret: ${{ secrets.HAOMAI_REPORTER_HMAC_SECRET }}
