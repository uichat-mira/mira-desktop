# One-shot branch-only trigger of the existing, reviewed Desktop Worker caller.
# No direct Worker implementation here; Desktop dev remains the execution base.
# Second attempt after Organization #90 and Desktop #484 repaired immutable Worker pin.
name: Start DSK-015 Worker (one-shot)
on:
  push:
    branches:
      - chore/dispatch-dsk-015
    paths:
      - .github/workflows/dispatch-dsk-015.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'uichat-mira/mira-desktop' && github.ref == 'refs/heads/chore/dispatch-dsk-015' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch approved DSK-015 on dev with bounded validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n '{ref:"dev",inputs:{issue_number:"481",validation_profile:"desktop-cloud-fast"}}' \
          | gh api --method POST --input - "repos/${GITHUB_REPOSITORY}/actions/workflows/mira-external-worker.yml/dispatches"
          echo "Requested existing dev Worker dispatch for Issue #481 and desktop-cloud-fast."
