name: Build Desktop Apps

on:
  push:
    branches: [dev, test, prod]
  pull_request:
    branches: [dev, test, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr:
    name: Check pull request
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package versions
        run: pnpm version:sync

      - name: Install clipper extension dependencies
        run: npm ci --prefix mira-clipper-ext --ignore-scripts

      - name: Type check
        run: pnpm check

      - name: Run DSK-005 Cloud Account UI and navigation regressions
        run: pnpm --filter @ui-chat-mira/desktop exec vitest run src/features/CloudAccount/__tests__/index.test.tsx src/app/routes/settingsRoutes.test.tsx src/app/Layouts/AppNavigationRail.test.tsx src/app/ChatApplicationStateBoundary.test.tsx

      - name: Verify release mirror contract
        run: node --test scripts/release/verify-release-mirror.test.mjs

      - name: Run Terminal Capability Lab regressions
        run: pnpm --filter @ui-chat-mira/desktop exec vitest run src/features/Extensions/Capabilities/cases.test.ts src/features/Extensions/Capabilities/hooks/useCapabilities.test.tsx src/features/Extensions/Capabilities/index.test.tsx src/features/Settings/pages/Tools/__tests__/useToolsWorkbench.test.tsx src/features/Settings/pages/Tools/components/ToolsPackagePanel.test.tsx src/features/Settings/pages/Tools/utils.test.ts

      - name: "Run #199 UI convergence regressions"
        run: pnpm --filter @ui-chat-mira/desktop exec vitest run src/shared/uchat/ui/UChatThreadView.test.tsx src/shared/uchat/ui/UChatAgentControls.test.tsx src/features/chat/components/roleChatState.test.ts src/features/chat/components/UChatThread.test.tsx

      - name: Run E05A sidebar visibility regression
        run: pnpm --filter @ui-chat-mira/desktop exec vitest run src/features/chat/components/UChatThreadListSidebar.test.tsx -t "hides Mira BASE from workspace groups even when legacy data lacks isDefault"

      - name: Run default Agent entry regressions
        run: pnpm --filter @ui-chat-mira/desktop exec vitest run src/features/chat/core/runtime.provider.test.tsx src/features/chat/components/UChatThread.test.tsx src/features/chat/core/protocol.test.ts

      - name: Run Agent route regressions
        run: pnpm --filter @ui-chat-mira/server test -- src/routes/proxy-provider/chat.routes.test.ts --testNamePattern='POST /proxy/chat/default passes agentEnabled true into createAndRunAgent|POST /proxy/chat/default routes knowledge-bound agent sends through AgentRun instead of the legacy RAG branch|POST /proxy/chat/default passes bound thread workspaceRoot into createAndRunAgent'

  build-electron:
    name: Build Electron (${{ matrix.platform }})
    if: github.event_name != 'pull_request' && contains(fromJSON('["dev","test","prod"]'), github.ref_name)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache Electron builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Cache Terminal Dev Runtime
        uses: actions/cache@v4
        with:
          path: .local-runtimes/terminal-dev
          key: ${{ runner.os }}-terminal-dev-${{ hashFiles('scripts/terminal-runtime.lock.json') }}

      - name: Cache local model packs
        uses: actions/cache@v4
        with:
          path: .local-models/raw
          key: ${{ runner.os }}-local-model-packs-v1-${{ hashFiles('scripts/prepare-local-model-packs.mjs') }}
          restore-keys: |
            ${{ runner.os }}-local-model-packs-v1-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package versions
        run: pnpm version:sync

      - name: Install clipper extension dependencies
        run: npm ci --prefix mira-clipper-ext --ignore-scripts

      - name: Configure clipper extension signing key
        env:
          MIRA_CLIPPER_CRX_PROD_PEM: ${{ secrets.MIRA_CLIPPER_CRX_PROD_PEM }}
        run: |
          New-Item -ItemType Directory -Force mira-clipper-ext/.keys | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path mira-clipper-ext/.keys) 'mira-clipper-prod.pem'),
            $env:MIRA_CLIPPER_CRX_PROD_PEM,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Type check
        run: pnpm check

      - name: Prepare local model packs
        run: pnpm prepare:local-model-packs
        env:
          LOCAL_MODEL_RAW_ROOT: .local-models/raw
          LOCAL_MODEL_ALLOW_NETWORK: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Build Electron (${{ matrix.platform }})
        run: node scripts/build-dist.js ${{ matrix.platform }}
        env:
          RELEASE_KEEP_COUNT: 3

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}
          path: |
            release/**/electron/*Setup*.exe
            release/**/electron/*Setup*.exe.blockmap
          if-no-files-found: error
          retention-days: 3
