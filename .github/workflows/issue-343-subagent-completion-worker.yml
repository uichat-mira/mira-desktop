name: "#343 Child Completion Proof Worker (Target Coverage Repair)"

on:
  push:
    branches:
      - feat/dispatch-343-subagent-completion
    paths:
      - .github/workflows/issue-343-subagent-completion-worker.yml

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    uses: uichat-mira/.github/.github/workflows/mira-external-worker.yml@c3006fe0043c087dfc7eb63af22b5fcc08ebf6d7
    with:
      issue_number: 343
      base_branch: feat/worker-343-38352937356-1
      provider: opencode-go
      model: deepseek-v4.1-flash
      verification_command: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm --filter @ui-chat-mira/server test -- src/skills/agent/pi-core.stream-fn.test.ts src/skills/agent/pi-core.schema-completion.test.ts src/skills/agent/pi-core.completion.test.ts src/skills/agent/pi-core.approval-resume.test.ts src/agent/__tests__/generic-task-subagent.test.ts src/agent/__tests__/generic-task-default-runtime.test.ts src/agent/__tests__/generic-task-resume.test.ts src/skills/agent/subagent-visibility.integration.test.ts --maxWorkers=1 --fileParallelism=false
        pnpm check
    secrets:
      opencode_go_api_key: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
