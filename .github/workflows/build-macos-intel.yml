name: Build macOS Intel

on:
  push:
    branches: [dev, test, prod]
  pull_request:
    branches: [dev, test, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos-intel:
    name: Build Electron (macOS Intel)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build-electron-macos-intel.yml
    with:
      skip_release_tests: ${{ github.ref_name != 'prod' }}
