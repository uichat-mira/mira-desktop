name: Release Production

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write

env:
  RELEASE_FACTORY_CONTEXT: release-factory-v2
  RELEASE_PUBLISH_CONTEXT: release-publish-r2

jobs:
  factory:
    name: Build and validate release
    uses: ./.github/workflows/release-factory-v2.yml
    secrets: inherit

  build-macos-intel:
    name: Build macOS Intel release asset
    uses: ./.github/workflows/build-electron-macos-intel.yml

  publish:
    name: Publish GitHub Release and Cloudflare R2
    needs: factory
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Publish running status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: process.env.RELEASE_PUBLISH_CONTEXT,
              description: 'Publishing GitHub Release and Cloudflare R2',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release_meta
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"

          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Tag ${tag} does not match package.json version ${package_version}." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${tag}"

      - name: Download Electron package
        uses: actions/download-artifact@v4
        with:
          name: release-factory-electron-${{ github.sha }}
          path: release-assets/electron

      - name: Download Tauri package
        uses: actions/download-artifact@v4
        with:
          name: release-factory-tauri-${{ github.sha }}
          path: release-assets/tauri

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p dist
          find release-assets -type f \( -name '*.exe' -o -name '*.blockmap' -o -name '*.msi' \) -print0 |
            while IFS= read -r -d '' file; do
              relative_path="${file#release-assets/}"
              safe_name=$(printf '%s' "$relative_path" | tr '/\\ ' '___')
              cp "$file" "dist/${safe_name}"
            done

          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          ls -lah dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      - name: Validate R2 secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release secret: ${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Upload release assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 5
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          latest_prefix="mira/latest"
          legacy_previous_prefix="mira/previous"

          aws s3 rm "s3://${R2_BUCKET}/${legacy_previous_prefix}/" \
            --recursive \
            --endpoint-url "$endpoint" \
            --only-show-errors || true

          for attempt in 1 2 3; do
            if aws s3 sync dist/ "s3://${R2_BUCKET}/${latest_prefix}/" \
              --delete \
              --endpoint-url "$endpoint" \
              --only-show-errors; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "R2 upload failed after ${attempt} attempts." >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done

          public_base="${R2_PUBLIC_BASE_URL%/}"
          {
            echo '### Cloudflare R2'
            echo "Uploaded current release assets to: ${public_base}/${latest_prefix}/"
            echo 'Retention: latest release only'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful release status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: process.env.RELEASE_PUBLISH_CONTEXT,
              description: 'GitHub Release and Cloudflare R2 published',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Publish failed release status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: process.env.RELEASE_PUBLISH_CONTEXT,
              description: 'GitHub Release or Cloudflare R2 publishing failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

  publish-macos-intel:
    name: Attach macOS Intel DMG to GitHub Release
    needs: [build-macos-intel, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release_meta
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Tag ${tag} does not match package.json version ${package_version}." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download Intel macOS package
        uses: actions/download-artifact@v4
        with:
          name: electron-macos-intel-${{ github.sha }}
          path: release-assets/macos-intel

      - name: Prepare macOS Intel release assets
        shell: bash
        run: |
          mkdir -p mac-release-assets
          find release-assets/macos-intel -type f \( -name '*.dmg' -o -name '*.dmg.blockmap' \) -print0 |
            while IFS= read -r -d '' file; do
              filename=$(basename "$file")
              cp "$file" "mac-release-assets/macos-intel_${filename}"
            done
          test -n "$(find mac-release-assets -maxdepth 1 -type f -print -quit)"
          ls -lah mac-release-assets/

      - name: Attach Intel macOS assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          files: mac-release-assets/*
          fail_on_unmatched_files: true

      - name: Validate R2 secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          missing=0
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release secret: ${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Upload Intel macOS assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 5
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          latest_prefix="mira/macos-intel/latest"

          for attempt in 1 2 3; do
            if aws s3 sync mac-release-assets/ "s3://${R2_BUCKET}/${latest_prefix}/" \
              --delete \
              --endpoint-url "$endpoint" \
              --only-show-errors; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "macOS Intel R2 upload failed after ${attempt} attempts." >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done

          public_base="${R2_PUBLIC_BASE_URL%/}"
          {
            echo '### Cloudflare R2 — macOS Intel'
            echo "Uploaded release macOS Intel assets to: ${public_base}/${latest_prefix}/"
            echo 'Retention: latest successful prod/tag macOS Intel publish wins'
          } >> "$GITHUB_STEP_SUMMARY"
