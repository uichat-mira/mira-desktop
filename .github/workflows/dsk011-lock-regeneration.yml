name: DSK-011 One-Time Generated Documentation Sync

# Temporary branch-scoped doc-index synchronization. Remove after index refresh
# has been committed. It never builds installers, releases or touches prod.
on:
  push:
    branches:
      - feat/dsk-011-tauri-retirement-recovery

permissions:
  contents: write

jobs:
  generate-doc-index:
    if: github.repository == 'uichat-mira/mira-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate docs index from repository sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/dsk-011-tauri-retirement-recovery"
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          node packages/docs-site/scripts/build-docs-index.mjs
          ! grep -qi '@tauri-apps/cli' pnpm-lock.yaml
          git diff --check
      - name: Commit generated documentation index
        shell: bash
        run: |
          set -euo pipefail
          git add -- packages/docs-site/src/generated/docs-index.json
          if git diff --cached --quiet; then
            echo 'Docs index already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(dsk-011): regenerate docs index from current sources'
          git push origin "HEAD:refs/heads/feat/dsk-011-tauri-retirement-recovery"
