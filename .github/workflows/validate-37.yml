name: Validate #37 Worker Caller

on:
  push:
    branches:
      - feat/37-external-worker-caller
    paths:
      - .github/workflows/mira-external-worker.yml
      - .github/workflows/validate-37.yml

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint thin caller workflow
        run: |
          docker run --rm             -v "$PWD:/repo"             --workdir /repo             rhysd/actionlint:1.7.7             -color             .github/workflows/mira-external-worker.yml
