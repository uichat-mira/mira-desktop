name: DSK-011 Docs Index Base Sync (temporary)
on:
  push:
    branches:
      - feat/dsk011-document-hygiene
    paths:
      - .github/workflows/dsk011-docs-index-base-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Merge latest dev and regenerate owned documentation index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev
          git merge --no-edit origin/dev
          git merge-base --is-ancestor origin/dev HEAD
          node packages/docs-site/scripts/build-docs-index.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('packages/docs-site/src/generated/docs-index.json', 'utf8'));
          const archived = index.documents.find(x => x.path === 'archive/microapp/computer-use-microapp-poc.md');
          if (!archived) throw new Error('Missing archived Computer Use document');
          for (const link of ['../../architecture/README.md', '../../architecture/ipc-and-preload.md', '../../tooling-runtime/tools-protocol.md']) {
            if (!archived.content.includes(link)) throw new Error('Stale link: ' + link);
          }
          const updated = index.documents.find(x => x.path === 'remote-access/dsk-007-cloud-grant-handoff.md');
          if (!updated) throw new Error('Missing updated dev document from regenerated index');
          console.log('DSK011_INDEX_REBASE: dev document and archived links included');
          NODE
          git diff --check
          git add -- packages/docs-site/src/generated/docs-index.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs(dsk-011): regenerate index on current dev baseline'
          fi
          git push origin HEAD:refs/heads/feat/dsk011-document-hygiene
