name: Agent Dispatch Real Worker POC

on:
  push:
    branches:
      - feat/agent-dispatch-poc-direct
    paths:
      - .github/workflows/agent-dispatch-real-worker-poc.yml

permissions:
  contents: write

jobs:
  worker:
    name: DeepSeek edits README through OpenCode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@v4
        with:
          ref: feat/agent-dispatch-poc-direct
          fetch-depth: 0

      - name: Install pinned OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.34
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run DeepSeek worker
        shell: bash
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.AI_PROVIDER_OPENCODE_GO_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
          OPENCODE_DISABLE_MODELS_FETCH: "1"
          NO_COLOR: "1"
        run: |
          set -euo pipefail

          export OPENCODE_AUTH_CONTENT
          OPENCODE_AUTH_CONTENT="$(jq -cn --arg key "$OPENCODE_GO_API_KEY" '{"opencode-go":{"type":"api","key":$key}}')"

          export OPENCODE_CONFIG_CONTENT
          OPENCODE_CONFIG_CONTENT='{
            "$schema": "https://opencode.ai/config.json",
            "share": "disabled",
            "autoupdate": false,
            "permission": {
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "list": "allow",
              "edit": "allow",
              "write": "allow",
              "skill": "deny",
              "bash": "deny",
              "task": "deny",
              "webfetch": "deny",
              "websearch": "deny",
              "question": "deny"
            }
          }'

          opencode run             --model opencode-go/deepseek-v4.1-flash             --agent build             --title "Mira mobile dispatch real-worker POC"             "You are the implementation worker for a tightly scoped POC. Modify only the repository root README.md. Replace its entire contents with exactly this single line, with no quotes and no additional prose: 牛马，起来干活了. Do not modify any other file. Do not run shell commands. After editing, stop."

      - name: Verify exact worker result
        shell: bash
        run: |
          set -euo pipefail
          expected='牛马，起来干活了'
          actual="$(cat README.md)"
          test "$actual" = "$expected"

          changed="$(git diff --name-only)"
          test "$changed" = "README.md"

      - name: Commit and push worker result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mira-agent-worker[bot]"
          git config user.email "mira-agent-worker[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "poc: dispatch DeepSeek README edit"
          git push origin HEAD:feat/agent-dispatch-poc-direct
